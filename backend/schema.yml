          readOnly: true
        feedback:
          allOf:
          - $ref: '#/components/schemas/ComplaintFeedbackInline'
          readOnly: true
        latest_history:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true

          type: string
          format: uuid
          readOnly: true
        rating:
          type: integer
          readOnly: true
          description: Rating score between 1 (worst) and 5 (best)
        satisfaction_level:
          allOf:
          - $ref: '#/components/schemas/SatisfactionLevelEnum'
          readOnly: true
        resolution_quality:
          allOf:
          - $ref: '#/components/schemas/ResolutionQualityEnum'
          readOnly: true
        timeliness:
          allOf:
          - $ref: '#/components/schemas/TimelinessEnum'
          readOnly: true
        comments:
          type: string
          readOnly: true
        is_issue_resolved:
          type: boolean
          readOnly: true

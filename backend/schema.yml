        * `IMAGE_ADDED` - Image Added
        * `REOPENED` - Complaint Reopened
        * `RESOLVED` - Complaint Resolved
        * `REJECTED` - Complaint Rejected
        * `NOTE_ADDED` - Note Added
    ComplaintImage:

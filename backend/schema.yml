          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
  /api/v1/users/profile/upload-image/:
    post:
      operationId: v1_users_profile_upload_image_create
      description: Upload or replace the authenticated user's profile image. Max 5
        MB, JPEG/PNG/WebP.
      summary: Upload profile image
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileImageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileImageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileImageRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
        '400':
          description: Invalid image file.
  /api/v1/users/search/:
    get:
      operationId: v1_users_search_list
      description: Search and filter all platform users. Supports free-text query
        across email, name, and phone, plus role and status filters.
      summary: Search users (admin only)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by email, name, or phone
      - in: query
        name: role
        schema:
          type: string
          enum:
          - AUTHORITY
          - CITIZEN
          - SUPER_ADMIN
        description: Filter by role
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
        description: Filter by status
      tags:
      - User Management
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserSearchList'
          description: ''
components:
  schemas:
    AdminProfile:
      type: object
      description: Full read-only profile for super-admin users — includes all fields.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF08Enum'
          readOnly: true
        bio:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserDepartmentAssignment'
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - bio
      - created_at
      - departments
      - email
      - full_name
      - is_active
      - phone
      - profile_image
      - public_id
      - role
      - status
      - updated_at
    AssignAuthorityRequest:
      type: object
      description: Validates input for assigning an authority to a department.
      properties:
        user_public_id:
          type: string
          format: uuid
        designation:
          type: string
          default: ''
          maxLength: 100
        is_head:
          type: boolean
          default: false
      required:
      - user_public_id
    AttachmentTypeEnum:
      enum:
      - IMAGE
      - AUDIO
      - VIDEO
      type: string
      description: |-
        * `IMAGE` - Image
        * `AUDIO` - Audio Recording
        * `VIDEO` - Video Evidence
    AuditLog:
      type: object
      description: Serializer for AuditLog entries.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          readOnly: true
        actor_role:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/AuditLogActionEnum'
          readOnly: true
        entity_type:
          type: string
          readOnly: true
          description: Type of entity affected (e.g. Complaint, User, Department,
            Feedback)
        entity_id:
          type: string
          readOnly: true
          description: Identifier or tracking code of affected entity
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        metadata:
          readOnly: true
          description: Additional context, diffs, or payload attributes
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - actor_role
      - created_at
      - entity_id
      - entity_type
      - ip_address
      - metadata
      - public_id
      - user_agent
    AuditLogActionEnum:
      enum:
      - AUTH_LOGIN
      - AUTH_LOGOUT
      - AUTH_REGISTER
      - PASSWORD_CHANGE
      - PROFILE_UPDATE
      - COMPLAINT_CREATED
      - COMPLAINT_STATUS_UPDATE
      - COMPLAINT_PRIORITY_UPDATE
      - COMPLAINT_ASSIGNED
      - DEPARTMENT_CREATED
      - DEPARTMENT_UPDATED
      - AUTHORITY_ASSIGNED
      - FEEDBACK_SUBMITTED
      - SYSTEM_EVENT
      type: string
      description: |-
        * `AUTH_LOGIN` - User Login
        * `AUTH_LOGOUT` - User Logout
        * `AUTH_REGISTER` - User Registration
        * `PASSWORD_CHANGE` - Password Changed
        * `PROFILE_UPDATE` - Profile Updated
        * `COMPLAINT_CREATED` - Complaint Created
        * `COMPLAINT_STATUS_UPDATE` - Complaint Status Updated
        * `COMPLAINT_PRIORITY_UPDATE` - Complaint Priority Updated
        * `COMPLAINT_ASSIGNED` - Authority Assigned to Complaint
        * `DEPARTMENT_CREATED` - Department Created
        * `DEPARTMENT_UPDATED` - Department Updated
        * `AUTHORITY_ASSIGNED` - Authority Assigned to Department
        * `FEEDBACK_SUBMITTED` - Feedback Submitted
        * `SYSTEM_EVENT` - System Event
    AuditLogSummary:
      type: object
      description: Summary metrics of audit log activity.
      properties:
        total_audit_events:
          type: integer
        security_events_count:
          type: integer
        top_actions:
          type: array
          items:
            type: object
            additionalProperties: {}
        actions_by_role:
          type: array
          items:
            type: object
            additionalProperties: {}
        last_active:
          type: string
      required:
      - actions_by_role
      - last_active
      - security_events_count
      - top_actions
      - total_audit_events
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - tokens
      - user
    AuthorityFeedbackStats:
      type: object
      description: Serializer for authority-level feedback metrics.
      properties:
        authority_email:
          type: string
          format: email
        total_feedbacks:
          type: integer
        average_rating:
          type: number
          format: double
        satisfaction_rate_percent:
          type: number
          format: double
        rating_distribution:
          type: object
          additionalProperties:
            type: integer
      required:
      - authority_email
      - average_rating
      - rating_distribution
      - satisfaction_rate_percent
      - total_feedbacks
    AuthorityProfile:
      type: object
      description: Read-only profile tailored for authority users — includes department
        assignments.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        bio:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserDepartmentAssignment'
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - bio
      - created_at
      - departments
      - email
      - full_name
      - phone
      - profile_image
      - public_id
    AuthorityStatusUpdateRequest:
      type: object
      description: Authority status update with resolution remarks.
      properties:
        status:
          $ref: '#/components/schemas/Status0e4Enum'
        remarks:
          type: string
          default: ''
      required:
      - status
    AuthorityUserInline:
      type: object
      description: Minimal user info embedded inside authority assignment responses.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
      required:
      - email
      - full_name
      - phone
      - public_id
    BlankEnum:
      enum:
      - ''
    CaptchaResponse:
      type: object
      properties:
        captcha_key:
          type: string
        captcha_svg:
          type: string
        expires_in:
          type: integer
      required:
      - captcha_key
      - captcha_svg
      - expires_in
    CategoryEnum:
      enum:
      - ROAD
      - WATER
      - ELECTRICITY
      - GARBAGE
      - DRAINAGE
      - SANITATION
      - STREET_LIGHT
      - PARKS
      - NOISE
      - OTHER
      type: string
      description: |-
        * `ROAD` - Road & Infrastructure
        * `WATER` - Water Supply
        * `ELECTRICITY` - Electricity
        * `GARBAGE` - Garbage & Waste
        * `DRAINAGE` - Drainage & Sewage
        * `SANITATION` - Sanitation & Hygiene
        * `STREET_LIGHT` - Street Light
        * `PARKS` - Parks & Public Spaces
        * `NOISE` - Noise Pollution
        * `OTHER` - Other
    CategoryPerformanceItem:
      type: object
      description: Per-category complaint breakdown.
      properties:
        category:
          type: string
        category_display:
          type: string
        total:
          type: integer
        resolved:
          type: integer
        pending:
          type: integer
        in_progress:
          type: integer
        resolution_rate:
          type: number
          format: double
      required:
      - category
      - category_display
      - in_progress
      - pending
      - resolution_rate
      - resolved
      - total
    ChangePasswordRequest:
      type: object
      description: Validates old password, then sets the new one.
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - confirm_password
      - new_password
      - old_password
    CitizenProfile:
      type: object
      description: Read-only profile tailored for citizen users.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        bio:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - bio
      - created_at
      - email
      - full_name
      - phone
      - profile_image
      - public_id
    ComplaintAttachment:
      type: object
      description: Read-only multimedia attachment representation (image, audio, video).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        file:
          type: string
          format: uri
          nullable: true
          readOnly: true
        attachment_type:
          allOf:
          - $ref: '#/components/schemas/AttachmentTypeEnum'
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        file_size:
          type: integer
          readOnly: true
          description: File size in bytes
        caption:
          type: string
          readOnly: true
        duration_seconds:
          type: number
          format: double
          readOnly: true
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment_type
      - caption
      - content_type
      - duration_seconds
      - file
      - file_size
      - original_filename
      - public_id
      - uploaded_at
    ComplaintAttachmentUploadRequest:
      type: object
      description: Validates multimedia attachment upload request.
      properties:
        file:
          type: string
          format: binary
        attachment_type:
          allOf:
          - $ref: '#/components/schemas/AttachmentTypeEnum'
          default: IMAGE
        caption:
          type: string
          default: ''
          maxLength: 255
        duration_seconds:
          type: number
          format: double
          nullable: true
      required:
      - file
    ComplaintCreateRequest:
      type: object
      description: Validates data for filing a new complaint.
      properties:
        category:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CategoryEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        department_public_id:
          type: string
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        priority:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        location_address:
          type: string
          default: ''
          maxLength: 500
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        images:
          type: array
          items:
            type: string
            format: binary
        audio:
          type: string
          format: binary
          nullable: true
        video:
          type: string
          format: binary
          nullable: true
        audio_duration:
          type: number
          format: double
          nullable: true
      required:
      - description
      - title
    ComplaintDetail:
      type: object
      description: Detailed read-only complaint representation with nested images,

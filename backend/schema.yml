          - $ref: '#/components/schemas/ComplaintUserInline'
          readOnly: true
        assigned_authority:
          allOf:
          - $ref: '#/components/schemas/ComplaintUserInline'
          readOnly: true
        location_address:
          type: string
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,8})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,8})?$
          readOnly: true
          nullable: true
        resolution_notes:
          type: string
          readOnly: true
        images:

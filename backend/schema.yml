          type: string
          readOnly: true
        new_status:
          type: string
          readOnly: true
        remarks:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - new_status
      - old_status
      - public_id
      - remarks

      description: Unread notification count response.
      properties:
        unread_count:
          type: integer
      required:
      - unread_count
    UpdateProfileRequest:
      type: object
      description: |-
        Writable serializer for self-service profile updates.

        Citizens and authorities may update: full_name, phone, bio, address.
        Department/designation assignment is managed via the departments module.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 20
        bio:
          type: string
        address:
          type: string
          maxLength: 255
      required:
      - full_name
    User:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF08Enum'
          readOnly: true
        address:
          type: string
          readOnly: true
        department:
          type: string
          readOnly: true
        designation:
          type: string
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        bio:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - bio
      - created_at
      - department
      - designation
      - email
      - full_name
      - phone
      - profile_image
      - public_id
      - role
      - status
    UserDepartmentAssignment:
      type: object
      description: Shows a user's department assignment — used inside user profile
        serializers.
      properties:
        department_public_id:
          type: string
          format: uuid
          readOnly: true
        department_name:
          type: string
          readOnly: true
        designation:
          type: string
          readOnly: true
        is_head:
          type: boolean
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_at
      - department_name
      - department_public_id
      - designation
      - is_head
    UserSearch:
      type: object
      description: Output serializer for admin user search results.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF08Enum'
          readOnly: true
        department:
          type: string
          readOnly: true
        department_name:
          type: string
          readOnly: true
        designation:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserDepartmentAssignment'
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - bio
      - created_at
      - department
      - department_name
      - departments
      - designation
      - email
      - full_name
      - is_active
      - phone
      - profile_image
      - public_id
      - role
      - status
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">CivicSetu street scene</title>
  <desc id="scene-desc">A citizen reports a road problem on her phone. A pin marks the spot, and a municipal worker repairs the road near the town hall, beside a streetlight, waste bins, trees and an auto-rickshaw.</desc>

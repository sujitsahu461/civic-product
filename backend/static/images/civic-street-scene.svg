  <path d="M122 44 c-6.6 0 -11 4.6 -11 10.8 c0 8 11 18.2 11 18.2 s11 -10.2 11 -18.2 c0 -6.2 -4.4 -10.8 -11 -10.8z" fill="#FF7722"/>
  <circle cx="122" cy="55" r="3.8" fill="#FFFFFF"/>
  <rect x="142" y="47" width="86" height="7" rx="3.5" fill="#5A4033" opacity="0.8"/>
  <rect x="142" y="60" width="60" height="6" rx="3" fill="#9C8778" opacity="0.55"/>

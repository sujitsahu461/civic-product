  <g fill="none" stroke="#FF7722" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity="0.85">
    <path d="M96 166 C 94 146, 104 128, 116 112"/>
    <path d="M246 88 C 290 98, 302 180, 300 233"/>
